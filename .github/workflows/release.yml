name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "创建 GitHub Release（仅在手动触发且已给 tag 时有效）"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: racewong-app
  DIST_NAME: racewong-app-windows-x64

jobs:
  build-windows:
    name: build (windows x64)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable (msvc)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable-x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('app/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run protocol tests
        run: cargo test --bins --release

      - name: Build release
        run: cargo build --release --locked

      - name: Verify exe has no console subsystem and icon embedded
        shell: pwsh
        run: |
          $exe = "target\release\$env:BIN_NAME.exe"
          if (-not (Test-Path $exe)) { throw "exe not found" }
          $fs = [System.IO.File]::OpenRead($exe)
          $br = New-Object System.IO.BinaryReader($fs)
          $fs.Position = 0x3C; $peOff = $br.ReadInt32()
          $fs.Position = $peOff + 4 + 20 + 68
          $subsystem = $br.ReadUInt16()
          $br.Close(); $fs.Close()
          if ($subsystem -ne 2) { throw "PE subsystem=$subsystem，预期 2(WINDOWS_GUI)，说明还会弹控制台" }
          $ico = [System.IO.File]::ReadAllBytes("assets\icon.ico")
          if ($ico[0] -ne 0 -or $ico[1] -ne 0 -or $ico[2] -ne 1) { throw "icon.ico invalid" }
          Write-Host "exe: $([math]::Round((Get-Item $exe).Length/1MB,2)) MB, subsystem=GUI"

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target\release\$env:BIN_NAME.exe" "dist\$env:DIST_NAME.exe"
          Copy-Item "README.md" "dist\README.txt"
          Copy-Item "assets\icon.ico" "dist\"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DIST_NAME }}
          path: app/dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            app/dist/${{ env.DIST_NAME }}.exe
            app/dist/README.txt
          fail_on_unmatched_files: true
          body: |
            RaceBox 跨平台同步桌面应用（Windows x64，单文件 exe，约 5 MB）。

            - BLE 扫描/连接 RaceBox，下载轨迹数据
            - 上传方式三选一：PostgreSQL 直连 / MQTT(RBX2) / 两者
            - 上传全部确认后自动清理设备内存（可关闭）
            - 上传失败自动写本地缓存，下次启动重传

            首次运行后配置在 `%APPDATA%\wongcw\racewong\config\config.json`，也可在“设置”页填写。
