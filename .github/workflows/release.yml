name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "创建 GitHub Release（手动触发时用当前分支名作为标签）"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: racewong-app

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            cmd: pwsh -NoProfile -File script/release.ps1 -BuildOnly -OutDir dist
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            cmd: bash script/release.sh --build-only --out-dir dist
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cmd: bash script/release.sh --build-only --out-dir dist
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config libxkbcommon-dev libssl-dev

      # runner 镜像里通常已经带了 wixtoolset，choco 再装同一个包（或更旧的版本）会失败，
      # 所以先探测 candle.exe，只有缺失时才装，且不带版本号。
      - name: Install WiX Toolset 3 (only if missing)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wixDir = "C:\Program Files (x86)\WiX Toolset v3.14\bin"
          if (Test-Path "$wixDir\candle.exe") {
            Write-Host "WiX 已安装: $wixDir"
            Add-Content -Path $env:GITHUB_PATH -Value $wixDir
            exit 0
          }
          if (Get-Command candle.exe -ErrorAction SilentlyContinue) {
            Write-Host "WiX 已在 PATH: $((Get-Command candle.exe).Source)"
            exit 0
          }
          choco install wixtoolset --yes --no-progress --ignore-checksums
          if ($LASTEXITCODE -ne 0) { Write-Host "choco 返回 $LASTEXITCODE，继续检查是否可用" }
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            throw 'WiX Toolset 3 不可用，无法生成要求的 MSI 安装包'
          }

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      # macOS 生成 ad-hoc 签名的 DMG；没有 Developer ID，因此用户首次运行仍需手动放行。
      - name: Build and package
        shell: bash
        run: ${{ matrix.cmd }}

      - name: Verify exe is GUI subsystem (no console window)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "app/target/${{ matrix.target }}/release/$env:BIN_NAME.exe"
          if (-not (Test-Path $exe)) { throw "exe 未生成: $exe" }
          $fs = [System.IO.File]::OpenRead($exe)
          $br = New-Object System.IO.BinaryReader($fs)
          $fs.Position = 0x3C; $peOff = $br.ReadInt32()
          $fs.Position = $peOff + 4 + 20 + 68
          $subsystem = $br.ReadUInt16()
          $br.Close(); $fs.Close()
          if ($subsystem -ne 2) { throw "PE subsystem=$subsystem，预期 2(WINDOWS_GUI)，说明还会弹控制台" }
          Write-Host "exe: $([math]::Round((Get-Item $exe).Length/1MB,2)) MB, subsystem=GUI"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          # 只上传最终发布文件。macOS 的 DMG 暂存目录含 /Applications 符号链接，
          # 若用 dist/* 会让 artifact 上传器遍历链接目标并长时间卡住。
          path: |
            dist/*.msi
            dist/*.dmg
            dist/*.deb
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate release notes from git log
        run: bash script/release.sh --notes-only > dist/release-notes.md

      - name: Create or update GitHub Release and upload packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          shopt -s nullglob
          files=(dist/*.msi dist/*.dmg dist/*.deb)
          if [ ${#files[@]} -eq 0 ]; then echo "没有可上传的安装包"; exit 1; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" --title "RaceBox同步 $TAG" --notes-file dist/release-notes.md "${files[@]}"
          fi
          echo "https://github.com/${{ github.repository }}/releases/tag/$TAG"
