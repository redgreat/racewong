name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "创建 GitHub Release（手动触发时用当前分支名作为标签）"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: racewong-app

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            cmd: pwsh -NoProfile -File script/release.ps1 -BuildOnly -OutDir dist
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            cmd: bash script/release.sh --build-only --out-dir dist
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cmd: bash script/release.sh --build-only --out-dir dist
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config libxkbcommon-dev libssl-dev

      - name: Install WiX Toolset 3
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install wixtoolset --version=3.14.1 --yes --no-progress

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Import Apple Developer ID certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_P12" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then
            echo "缺少 Apple Developer ID 证书 secrets，拒绝生成会被 Gatekeeper 拦截的 DMG"
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/racewong.keychain-db"
          CERT="$RUNNER_TEMP/developer-id.p12"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$CERT"
          security create-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          security import "$CERT" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$KEYCHAIN"

      - name: Build and package
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ${{ matrix.cmd }}

      - name: Verify exe is GUI subsystem (no console window)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "app/target/${{ matrix.target }}/release/$env:BIN_NAME.exe"
          if (-not (Test-Path $exe)) { throw "exe 未生成: $exe" }
          $fs = [System.IO.File]::OpenRead($exe)
          $br = New-Object System.IO.BinaryReader($fs)
          $fs.Position = 0x3C; $peOff = $br.ReadInt32()
          $fs.Position = $peOff + 4 + 20 + 68
          $subsystem = $br.ReadUInt16()
          $br.Close(); $fs.Close()
          if ($subsystem -ne 2) { throw "PE subsystem=$subsystem，预期 2(WINDOWS_GUI)，说明还会弹控制台" }
          Write-Host "exe: $([math]::Round((Get-Item $exe).Length/1MB,2)) MB, subsystem=GUI"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate release notes from git log
        run: bash script/release.sh --notes-only > dist/release-notes.md

      - name: Create or update GitHub Release and upload packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          shopt -s nullglob
          files=(dist/*.msi dist/*.dmg dist/*.deb)
          if [ ${#files[@]} -eq 0 ]; then echo "没有可上传的安装包"; exit 1; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" --title "RaceBox 同步 $TAG" --notes-file dist/release-notes.md "${files[@]}"
          fi
          echo "https://github.com/${{ github.repository }}/releases/tag/$TAG"
