[package]
name = "racewong-app"
version = "0.1.9"
edition = "2021"
description = "RaceBox BLE sync desktop app: download, PostgreSQL/MQTT upload, device memory erase"

[dependencies]
eframe = "0.31"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
btleplug = "0.11"
rumqttc = { version = "0.24", default-features = false }
tokio-postgres = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
semver = "1"
uuid = { version = "1", features = ["v4"] }
crc32fast = "1"
chrono = { version = "0.4", features = ["clock"] }
directories = "5"
async-trait = "0.1"
futures-util = "0.3"
flexi_logger = "0.29"
log = "0.4"

# 鎵樼洏鍥炬爣锛圵indows 閫氱煡鍖哄煙 / macOS 鑿滃崟鏍忥級銆?# 鍙湪杩欎袱涓钩鍙板紩鍏ワ細Linux 鐨勬墭鐩樺疄鐜颁緷璧?GTK/AppIndicator 绯荤粺搴擄紝
# 浼氳 `cargo test` 鍜屽師鐢熸瀯寤哄嚟绌哄鍑虹郴缁熶緷璧栵紝鑰屼氦鍙夌紪璇?Windows 鐢ㄤ笉鍒般€?[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = "0.19"

# 鍙栦富绐楀彛鐨?HWND锛堟墭鐩樿彍鍗曠洿鎺ユ搷浣滅獥鍙ｇ敤锛夈€?# eframe / winit 鏈潵灏变緷璧栧悓涓€涓?0.6锛岃繖閲屽彧鏄樉寮忓０鏄庯紝涓嶄細澶氱紪璇戜竴浠姐€?[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"

[build-dependencies]
winres = "0.1"

[profile.release]
strip = true
lto = true
opt-level = "s"
