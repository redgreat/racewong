[package]
name = "racewong-app"
version = "0.1.7"
edition = "2021"
description = "RaceBox BLE sync desktop app: download, PostgreSQL/MQTT upload, device memory erase"

[dependencies]
eframe = "0.31"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
btleplug = "0.11"
rumqttc = { version = "0.24", default-features = false }
tokio-postgres = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
semver = "1"
uuid = { version = "1", features = ["v4"] }
crc32fast = "1"
chrono = { version = "0.4", features = ["clock"] }
directories = "5"
async-trait = "0.1"
futures-util = "0.3"
flexi_logger = "0.29"
log = "0.4"

# 托盘图标（Windows 通知区域 / macOS 菜单栏）。
# 只在这两个平台引入：Linux 的托盘实现依赖 GTK/AppIndicator 系统库，
# 会让 `cargo test` 和原生构建凭空多出系统依赖，而交叉编译 Windows 用不到。
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = "0.19"

[build-dependencies]
winres = "0.1"

[profile.release]
strip = true
lto = true
opt-level = "s"
